name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            gradle: ./gradlew.bat
          - os: ubuntu-latest
            gradle: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: ${{ matrix.gradle }} test buildPlugin --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-and-tests-${{ matrix.os }}
          path: |
            build/distributions/*.zip
            build/reports/tests/
            build/test-results/

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify IDEA 2026.3 and Rider 2026.2.4.1
        run: ./gradlew verifyPlugin -PverifierOffline=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-reports
          path: build/reports/pluginVerifier/
